<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050810" />
  <meta name="color-scheme" content="dark" />
  <title>Каламити Кодекс — путеводитель по Terraria Calamity</title>
  <meta name="description" content="Русский спутник по Terraria + Calamity: 30 квестов, 2500+ предметов, боссы, крафты и биомы." />
  <link rel="icon" href="assets/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Russo+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/modern.css" />
  <link rel="stylesheet" href="css/reborn.css" />
  <link rel="stylesheet" href="css/architecture.css" />
</head>
<body>
  <a class="skip-link" href="#app">Перейти к содержимому</a>
  <canvas id="embers" aria-hidden="true"></canvas>

  <div class="shell">
    <header class="rail" id="rail" aria-label="Основная навигация">
      <a class="rail-brand" href="#/" aria-label="Каламити Кодекс — на главную">
        <span class="brand-art"><img src="assets/favicon.png" alt="" width="128" height="128" /></span>
        <span class="brand-copy">
          <b>Каламити</b>
          <small>кодекс · 2.2.2</small>
        </span>
      </a>

      <div class="nav-caption">Навигация</div>
      <nav class="rail-nav" id="main-nav">
        <a href="#/" data-nav="home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 11 8-7 8 7v9h-5v-6H9v6H4z"/></svg>
          <span>Главная</span>
        </a>
        <a href="#/novice?q=1" data-nav="novice">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4m0 1h11l-2.5 4L16 13H5"/></svg>
          <span>Путь новичка</span><em>30</em>
        </a>
        <a href="#/wiki" data-nav="wiki">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H11v17H7.5A3.5 3.5 0 0 0 4 22zm16 0A3.5 3.5 0 0 0 16.5 2H13v17h3.5A3.5 3.5 0 0 1 20 22z"/></svg>
          <span>Справочник</span>
        </a>
        <a href="#/bosses" data-nav="bosses">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 20v-3a7 7 0 1 1 10 0v3m-10-1h10M9 11h.01M15 11h.01M10 15h4M6 6 3 3m15 3 3-3"/></svg>
          <span>Боссы</span><em>36</em>
        </a>
        <a href="#/items" data-nav="items">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v12H4zM7 8V5h10v3m-5 0v12m-2-7h4"/></svg>
          <span>Предметы</span><em>2.5K</em>
        </a>
        <a href="#/favorites" data-nav="favorites">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"/></svg>
          <span>Избранное</span><em data-favorites-count>0</em>
        </a>
        <a href="#/lex" data-nav="lex">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Zm0 0v18m3-13h6m-6 4h6"/></svg>
          <span>Словарь</span>
        </a>
        <a href="#/crafts" data-nav="crafts">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5 5 5M7 21l-4-4L15 5l4 4zM4 4l4 4m-2-6 4 4"/></svg>
          <span>Крафты</span>
        </a>
        <a href="#/biomes" data-nav="biomes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zm6-3v15m6-12v15"/></svg>
          <span>Биомы</span>
        </a>
      </nav>

      <div class="rail-extra" id="rail-extra"></div>

      <div class="rail-footer">
        <div class="rail-progress">
          <span><b>Путь героя</b><i id="rail-progress-label">0 / 30</i></span>
          <div class="rail-progress-track"><i id="rail-progress-fill"></i></div>
        </div>
        <p><span class="status-dot"></span> Каталог доступен офлайн</p>
      </div>
    </header>

    <div class="stage">
      <header class="stage-bar">
        <button class="burger" id="menu-btn" type="button" aria-label="Открыть меню" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>

        <div class="page-context" aria-live="polite">
          <small>Calamity Codex</small>
          <b id="route-title">Главная</b>
        </div>

        <label class="search" aria-label="Глобальный поиск">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="global-search" type="search" placeholder="Найти предмет, босса, крафт…" autocomplete="off" spellcheck="false" />
          <kbd>Ctrl K</kbd>
        </label>

        <a class="favorite-mini" href="#/favorites" data-nav="favorites" aria-label="Открыть избранное" title="Рюкзак героя">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"/></svg>
          <span class="favorite-count" data-favorites-count>0</span>
        </a>

        <a class="journey-mini" href="#/novice?q=1" title="Продолжить путь новичка">
          <span class="journey-gem" aria-hidden="true"></span>
          <span><small>Прогресс</small><b id="journey-count">0%</b></span>
        </a>
      </header>

      <div id="search-panel" class="search-drop hidden" role="dialog" aria-label="Результаты поиска"></div>
      <main id="app" tabindex="-1"></main>
    </div>
  </div>

  <nav class="mobile-tabs" aria-label="Быстрая навигация">
    <a href="#/" data-nav="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 11 8-7 8 7v9h-5v-6H9v6H4z"/></svg><span>Главная</span></a>
    <a href="#/novice?q=1" data-nav="novice"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4m0 1h11l-2.5 4L16 13H5"/></svg><span>Путь</span></a>
    <a href="#/bosses" data-nav="bosses"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 20v-3a7 7 0 1 1 10 0v3m-10-1h10M9 11h.01M15 11h.01"/></svg><span>Боссы</span></a>
    <a href="#/items" data-nav="items"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v12H4zM7 8V5h10v3m-5 3v6"/></svg><span>Предметы</span></a>
  </nav>

  <button class="to-top" id="to-top" type="button" aria-label="Наверх">↑</button>
  <div id="rail-scrim" class="rail-scrim" hidden></div>
  <div id="tt" class="tt" hidden></div>
  <div id="live-region" class="sr-only" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/extra.js"></script>
  <script src="js/lexicon.js"></script>
  <script src="js/plain.js"></script>
  <script src="js/plain-late.js"></script>
  <script src="js/polish.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
